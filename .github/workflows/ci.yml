name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sendvery
          POSTGRES_PASSWORD: sendvery
          POSTGRES_DB: sendvery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sendvery:sendvery@localhost:5432/sendvery_test?serverVersion=17

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, sodium
          # pcov, not Xdebug: measured at 35s of coverage overhead against
          # Xdebug's 120s on this suite. The two drivers do disagree slightly —
          # CodeCoverage::applyExecutableLinesFilter() intersects the driver's
          # line map with its own static analysis, and they differ over
          # attribute arguments in two API Platform resource classes, 26
          # statements in all — which is why coverage-baseline.json is recorded
          # from a pcov report and CI's own clover is uploaded below.
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run migrations
        run: bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run PHPUnit
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Coverage ratchet
        # The 100%-coverage rule is enforced as a ratchet, not a cliff: the debt
        # recorded in coverage-baseline.json is tolerated, a new uncovered line
        # is not. Reuses the clover the step above already wrote — a second full
        # run with coverage would roughly double this job.
        #
        # Deliberately not `if: always()`: a failed suite produces a partial
        # clover, and gating on that would bury the real failure under hundreds
        # of phantom regressions.
        run: php bin/coverage-audit.php coverage.xml --ratchet

      - name: Upload coverage report
        # This artifact is how the baseline is re-recorded: download it from the
        # run that failed and --update against it. CI is the reference
        # environment, so recording from its own clover is immune to whatever
        # driver or PHP patch version a developer happens to have locally.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  phpstan:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, sodium

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Warm up Symfony cache
        run: bin/console cache:warmup --env=dev
        env:
          DATABASE_URL: postgresql://localhost/fake?serverVersion=17

      - name: Run PHPStan
        run: vendor/bin/phpstan --memory-limit=-1 analyse

  cs-check:
    name: Code Style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes

  browser:
    # The smoke net for defects PHPUnit cannot see: CSS hit-testing (every
    # report row opening the same report), Stimulus/Turbo breakage that only
    # surfaces as a console error, and the axe accessibility baseline.
    # Separate job because it needs a booted app, a database with demo data and
    # a real browser — none of which the other jobs want.
    name: Browser Smoke
    runs-on: ubuntu-latest
    # The whole suite is ~25s locally. Anything past this is a hang, and the
    # 360-minute default would burn a runner all afternoon to tell us so.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sendvery
          POSTGRES_PASSWORD: sendvery
          POSTGRES_DB: sendvery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # dev, not test: /_test/login answers in dev and test only, the demo
      # seeder refuses prod, and dev is the environment a developer running this
      # suite locally is driving — a browser net that exercises a different
      # environment than anybody looks at is worth less.
      APP_ENV: dev
      DATABASE_URL: postgresql://sendvery:sendvery@localhost:5432/sendvery?serverVersion=17
      SENDVERY_BASE_URL: http://localhost:8000
      # No Docker here: bin/console runs on the runner itself.
      SENDVERY_CONSOLE_PREFIX: php
      # Enables /_test/login for this job only. Set HERE and not in a committed
      # .env file because the endpoint signs in as any existing user, so its
      # secret must never be published or baked into an image — locally it lives
      # in the gitignored .env.dev.local. A real env var wins over every .env
      # file, so the app started below and the Playwright process both see this
      # one value. Not a repository secret: this database is created and thrown
      # away inside this job.
      SENDVERY_TEST_LOGIN_SECRET: ci-browser-smoke-only

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, sodium

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm install

      - name: Run migrations
        run: bin/console doctrine:migrations:migrate --no-interaction

      - name: Build frontend assets
        # Without this the pages render unstyled, which would make every
        # colour-contrast number in the axe baseline meaningless.
        run: |
          bin/console importmap:install
          bin/console tailwind:build

      - name: Install Chromium
        # Not cached here, unlike a developer's machine: --with-deps also pulls
        # the shared libraries a headless Chromium needs on a bare runner.
        run: npx playwright install --with-deps chromium

      - name: Wire this job's environment into the app
        # EVERY variable the web process needs goes here, and what makes this work
        # is the file's POSITION, not its contents: Dotenv loads .env.dev.local
        # LAST, after .env and .env.dev, so it wins outright. That is immunity
        # rather than a workaround — it does not care what `variables_order` says
        # or which SAPI is asking, which is the whole problem with relying on the
        # job's `env:` block reaching the app.
        #
        # Why the `env:` block is not enough, measured rather than assumed: Dotenv
        # only leaves an existing variable alone when PHP has already put the name
        # in $_ENV or $_SERVER. Plain CLI does — so `bin/console` (migrations,
        # seeding, tailwind:build) resolved everything correctly and hid this for
        # three runs — but `php -S` rebuilds $_SERVER per request from request data
        # and, under php.ini-production's default variables_order="GPCS", $_ENV is
        # never filled either. The committed default then wins and the web process
        # quietly runs on docker-compose values. It cost two red runs: an inert
        # /_test/login (empty secret) and then a 500 on every dashboard URL
        # ("could not translate host name 'database'") while / still served 200,
        # because the marketing homepage touches no database.
        #
        # The list, and why each variable is or is not here:
        #   SENDVERY_TEST_LOGIN_SECRET — committed .env and .env.dev set it EMPTY
        #     on purpose (the endpoint signs in as any existing user, so no working
        #     value may be published), and empty is an inert endpoint.
        #   DATABASE_URL — committed .env points at the docker-compose service
        #     hostname `database`, which does not exist on a runner.
        #   MAILER_DSN — committed .env points at `mailpit`, the other
        #     compose-only hostname, and SendEmailMessage is NOT routed to a
        #     transport, so mail is sent in-request: any path that sends one would
        #     500 on DNS. null://null is what .env.test already uses for the same
        #     reason.
        #   APP_ENV — deliberately absent, and it cannot be fixed here anyway:
        #     this file is only loaded BECAUSE APP_ENV resolved to dev, so setting
        #     it here is circular. It is safe today for two independent reasons
        #     that agree — Dotenv's own default is 'dev' and committed .env says
        #     `dev` — so the job's value is never actually consulted by the web
        #     process. A job that wanted APP_ENV=test would silently run as dev;
        #     that would need .env.local, or a different filename here.
        #   SENDVERY_BASE_URL, SENDVERY_CONSOLE_PREFIX — deliberately absent: the
        #     app never reads them (grep-confirmed across src/, config/ and
        #     templates/). They are Playwright-side only, and Node reads
        #     process.env directly, where the job's `env:` block always wins.
        #
        # Anything added to `env:` above for the APP's benefit must be added here
        # too, or it will be silently ignored by the web process. Values must stay
        # dotenv-safe (no spaces, quotes or #); both of these are fixed literals in
        # this file, so that is a property we control. .env.dev.local is gitignored
        # and dockerignored, and this runner is destroyed with the job.
        #
        # This is also byte-for-byte the procedure CLAUDE.md documents for a
        # developer, so CI now exercises the same wiring a human does — worth
        # having in a suite whose entire value is fidelity.
        run: |
          {
            echo "SENDVERY_TEST_LOGIN_SECRET=$SENDVERY_TEST_LOGIN_SECRET"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "MAILER_DSN=null://null"
          } > .env.dev.local

      - name: Start the app
        # PHP's built-in server with the front controller as the router script.
        # PHP_CLI_SERVER_WORKERS keeps a page's asset requests from queueing
        # behind each other on a single-threaded server.
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S 0.0.0.0:8000 -t public public/index.php > /tmp/php-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8000/; then
              echo "app is up"
              exit 0
            fi
            sleep 1
          done
          echo "app did not start; server log:" && cat /tmp/php-server.log && exit 1

      - name: Run browser smoke tests
        # global-setup seeds the demo team and asserts the app answers before
        # any spec runs.
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: var/playwright/
          retention-days: 7

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/php-server.log
